name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The release notes list every commit since the previous tag.
          fetch-depth: 0
      # vX.Y.Z releases version X.Y.Z (see "Releasing" in README.md).
      - name: Check the tag matches the version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml (want v$version)"
            exit 1
          fi
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --locked --release
        env:
          # Also writes target/release/screen-time-manager.pdb, published below so the addresses in
          # Windows crash reports can be looked up. The exe only names the file, not the path it was
          # built in.
          CARGO_PROFILE_RELEASE_STRIP: none
      - run: installer/build.ps1
        shell: pwsh
      - name: Release notes
        shell: bash
        run: bash ci/release-notes.sh "$GITHUB_REF_NAME" > notes.md && cat notes.md
      # The setup is the only download: it's how the app is installed, and what the app's updater
      # fetches (the latest release's *-windows-x64-setup.exe, checked against GitHub's SHA-256).
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem target/installer/*-windows-x64-setup.exe | ForEach-Object FullName)
          if ($files.Count -ne 1) { throw "Expected one setup in target/installer, found $($files.Count)" }
          # Only for looking up crash report addresses, so a release goes out without it if need be.
          if (Test-Path target/release/screen-time-manager.pdb) { $files += "target/release/screen-time-manager.pdb" } else { Write-Warning "No screen-time-manager.pdb to publish" }
          gh release create $env:GITHUB_REF_NAME @files --title "Screen Time Manager $env:GITHUB_REF_NAME" --notes-file notes.md

  # Updates the previous release to this one through the app's updater, as installed copies will.
  update:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: installer/update-test.ps1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
