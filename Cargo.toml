[package]
name = "screen-time-manager"
version = "1.1.0"
edition = "2021"
description = "A screen time management application that runs in the system tray"
authors = ["Screen Time Manager contributors"]
license = "MIT"

[dependencies]
# Windows API bindings
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Shutdown",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_UI_HiDpi",
    "Win32_System_RemoteDesktop",
    "Win32_System_Com",
    "Win32_System_TaskScheduler",
] }

# SQLite database
rusqlite = { version = "0.32", features = ["bundled"] }

# For finding app data directories
dirs = "5.0"

# Telegram bot
teloxide = { version = "0.13", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

# Discord bot
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "native_tls_backend", "model"] }

# HTTP client for wizard and the self-updater
ureq = "2.9"
urlencoding = "2.1"

# Self-updater: GitHub release JSON, and checking the installer's SHA-256
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
embed-resource = "2.4"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Link-time optimization
codegen-units = 1   # Single codegen unit for better optimization
panic = "abort"     # Abort on panic (smaller binary)
strip = true        # Strip symbols
